<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory — RoleBase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/forms.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/employee/list}">
        <span class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4 5.5V11c0 5 3.4 8.9 8 10 4.6-1.1 8-5 8-10V5.5L12 2z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="brand-text">Employee Directory</span>
    </a>
    <div class="navbar-right">
<span class="role-badge"
      th:classappend="${'role-' + #authentication.principal.plainRole.toLowerCase()}"
      th:text="${#strings.capitalize(#authentication.principal.plainRole.toLowerCase())}">
    ROLE
</span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header">
        <h1 class="page-title">Employee Table</h1>
        <!--        Only ADMIN and HR can add Employee to the database-->
        <a sec:authorize="hasAnyRole('ADMIN','HR')"
           th:href="@{/employee/showFormAdd}"
           class="btn-add">+ Add Employee</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Department</th>
                <th>Email</th>
                <th sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')" >Phone</th>
                <!--                Show the action button only if the session role is not an employee-->
                <th sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tempEmployee : ${employees}">
                <td data-label="Name" th:text="${tempEmployee.name}"></td>
                <td data-label="Role"><span class="role-tag" th:text="${tempEmployee.role}"></span></td>
                <td data-label="Department" th:text="${tempEmployee.department}"></td>
                <td data-label="Email" th:text="${tempEmployee.email}"></td>
                <td data-label="Phone" sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')" th:text="${tempEmployee.phone}"></td>
                <td class="buttons">
                    <!--                    Except the Employee the rest can update the employee details-->
                    <a sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')"
                       th:href="@{/employee/showFormUpdate(employeeId=${tempEmployee.id})}"
                       class="btn-update">Update</a>
                    <!--                    only an Admin or the Manager can delete an employee from the database-->
                    <a sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                       th:href="@{/employee/deleteEmployee(employeeId=${tempEmployee.id})}"
                       class="btn-delete"
                       onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
